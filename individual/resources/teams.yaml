# Participantes del scoreboard individual.
#
# Cada bloque es un participante (estudiante). Todas las variables se pasan
# como entorno a los checkers de services.yaml.
#
# Variables especiales:
#   SERVICES       Servicios que se le verifican a este participante, separados
#                  por coma o espacio. Deben coincidir con los nombres de
#                  services.yaml. Si se omite, se le verifican TODOS.
#   IP             (opcional) IP que se muestra y se hace ping en "Host reachability".
#   TEAM_PASSWORD  (opcional) Contraseña para entrar a su página de injects.
#
# Las IPs y credenciales de abajo son de ejemplo: reemplázalas por las reales
# en tu copia local y no las subas al repo.
Connor:
  SERVICES: "FTP,WEB,HTTPS,DNS"
  IP: "172.16.101.154"
  FTP_HOST: "172.16.101.154"
  WEB_URL: "http://172.16.101.154"
  HTTPS_URL: "https://172.16.101.154"
  DNS_SERVER: "172.16.101.154"
  DNS_RECORD: "connor.lab.local"
