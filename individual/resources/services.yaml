# Catálogo de servicios del scoreboard individual.
#
# Cada participante elige cuáles le aplican con la variable SERVICES en
# teams.yaml; a los demás no se les ejecuta el checker. Las variables ($AD_HOST,
# $WEB_URL, ...) salen del bloque de cada participante en teams.yaml.
AD: AD/nologin.sh $AD_HOST
DNS: DNS/lookup.sh $DNS_RECORD $DNS_SERVER
FTP: FTP/login.sh $FTP_HOST $FTP_USER:$FTP_PASS
WEB: WEB/http_up.sh $WEB_URL
SSH: SSH/nologin.sh $SSH_HOST
SMTP: MAIL/smtp_check.py $SMTP_HOST $SMTP_PORT $SMTP_USER $SMTP_PASS $SMTP_FROM $SMTP_TO --starttls
POP3: MAIL/pop3_check.py $POP3_HOST $POP3_PORT $POP3_USER $POP3_PASS --ssl
