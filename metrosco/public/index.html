<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metro CCDC Scoreboard</title>
    <script type="module" crossorigin src="/assets/index.8936522c.js"></script>
    <link rel="stylesheet" href="/assets/index.20324306.css">
  </head>
  <body class="bg-slate-100 dark:bg-zinc-900 dark:text-zinc-100">
    <div id="root"></div>
    <div id="reachability-bar"></div>
    <script>
      (function () {
        const descriptions = {
          HTTP: "TCP 80: HTTP GET + body compare",
          HTTPS: "TCP 443: HTTPS GET (skip TLS verify) + body compare",
          SMTP: "TCP 587: SMTP AUTH + STARTTLS + send probe mail",
          POP3: "TCP 995: POP3S login handshake",
          FTP: "TCP 21: FTP login then path accessibility check",
          DNS: "UDP/TCP 53: Resolve record via specified DNS server",
          Splunk: "TCP 8000: Port open check to Splunk web UI",
        };

        const applyDescriptions = () => {
          document.querySelectorAll("thead tr th").forEach((th) => {
            const name =
              th.firstChild && th.firstChild.textContent && th.firstChild.textContent.trim();
            if (!name || !descriptions[name] || th.querySelector(".svc-desc")) return;
            const desc = document.createElement("div");
            desc.className = "svc-desc text-sm font-semibold text-slate-700 dark:text-slate-200";
            desc.textContent = descriptions[name];
            th.appendChild(desc);
          });

          document.querySelectorAll("table tbody tr td:first-child").forEach((td) => {
            const name =
              td.firstChild && td.firstChild.textContent && td.firstChild.textContent.trim();
            if (!name || !descriptions[name] || td.querySelector(".svc-desc")) return;
            const desc = document.createElement("div");
            desc.className = "svc-desc text-sm font-semibold text-slate-900 dark:text-slate-100";
            desc.textContent = descriptions[name];
            td.appendChild(desc);
          });
        };

        const observer = new MutationObserver(() => applyDescriptions());
        window.addEventListener("DOMContentLoaded", () => {
          const root = document.getElementById("root");
          if (root) observer.observe(root, { childList: true, subtree: true });
          applyDescriptions();
        });
      })();
    </script>
    <script>
      (function () {
        const containerId = "reachability-bar";
        const title = "Host reachability";
        const pollingMs = 5000;

        const buildCircle = (status) => {
          const wrapper = document.createElement("div");
          wrapper.className = "flex flex-col items-center px-3";

          const circle = document.createElement("div");
          circle.className =
            "h-8 w-8 rounded-full border-2 shadow " +
            (status.reachable
              ? "bg-green-500 border-green-700"
              : "bg-red-500 border-red-700");
          wrapper.appendChild(circle);

          const name = document.createElement("div");
          name.className = "text-sm font-semibold mt-1 text-center";
          name.textContent = status.name;
          wrapper.appendChild(name);

          const ip = document.createElement("div");
          ip.className = "text-xs text-slate-600 dark:text-slate-300";
          const method = status.method || "ICMP ping";
          ip.textContent = `${status.ip} • ${method}`;
          wrapper.appendChild(ip);

          return wrapper;
        };

        const render = (data) => {
          const host = document.getElementById(containerId);
          if (!host) return;
          const parent =
            document.querySelector("h1")?.parentElement || document.body;
          if (!parent.contains(host)) {
            parent.insertBefore(host, parent.children[1] || null);
          }
          host.className =
            "my-4 bg-slate-50 dark:bg-zinc-800 p-3 rounded-xl shadow-md border border-slate-200 dark:border-zinc-700";
          host.innerHTML = "";

          const heading = document.createElement("h2");
          heading.className = "text-2xl font-bold text-center mb-2";
          heading.textContent = title;
          host.appendChild(heading);

          const row = document.createElement("div");
          row.className = "flex flex-wrap justify-center gap-3";
          data.forEach((status) => row.appendChild(buildCircle(status)));
          host.appendChild(row);
        };

        const fetchReachability = async () => {
          try {
            const res = await fetch("/api/reachability", { credentials: "include" });
            if (!res.ok) return;
            const data = await res.json();
            render(data);
          } catch (e) {
            console.error("reachability fetch failed", e);
          }
        };

        window.addEventListener("DOMContentLoaded", () => {
          fetchReachability();
          setInterval(fetchReachability, pollingMs);
        });
      })();
    </script>
  </body>
</html>
