<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metro CCDC Scoreboard</title>
    <script type="module" crossorigin src="/assets/index.8936522c.js"></script>
    <link rel="stylesheet" href="/assets/index.20324306.css">
    <style>
      #root {
        display: none;
      }
    </style>
  </head>
  <body class="bg-slate-100 dark:bg-zinc-900 dark:text-zinc-100">
    <div id="inject-schedule-only"></div>
    <div id="root"></div>
    <script>
      (function () {
        const schedule = [
          {
            start: "00:01",
            end: "00:21",
            inject: "INV01 - Inventory Report",
            description: "",
            duration: 20,
          },
          {
            start: "00:05",
            end: "00:35",
            inject: "BCOM01T - Network Inventory Management Report",
            description: "",
            duration: 30,
          },
          {
            start: "00:06",
            end: "00:56",
            inject: "END01 - Malware Mitigation",
            description: "",
            duration: 50,
          },
          {
            start: "00:10",
            end: "01:00",
            inject: "DSGN02T - Understanding Network Data Flows",
            description: "",
            duration: 50,
          },
          {
            start: "00:15",
            end: "00:45",
            inject: "DSGN07T - Design Network Isolation Requirement",
            description: "",
            duration: 30,
          },
          {
            start: "00:20",
            end: "01:05",
            inject: "BCOM06A - Memo to Explain FW Features to Customer",
            description: "",
            duration: 45,
          },
          {
            start: "00:22",
            end: "01:32",
            inject: "HFW06 - Restrict Internal Cross Network Traffic",
            description: "",
            duration: 70,
          },
          {
            start: "00:25",
            end: "01:15",
            inject: "HDN03 - Evaluate Windows Servers",
            description: "",
            duration: 50,
          },
          {
            start: "00:25",
            end: "01:15",
            inject: "HDN02 - Evaluate Linux Servers",
            description: "",
            duration: 50,
          },
          {
            start: "00:30",
            end: "01:50",
            inject: "NETW11A - VLAN Attack Concern",
            description: "",
            duration: 80,
          },
          {
            start: "00:35",
            end: "01:15",
            inject: "HDN05 - Create a Linux Password Policy",
            description: "",
            duration: 40,
          },
          {
            start: "00:35",
            end: "01:15",
            inject: "HDN04 - Password Policy Using GPO",
            description: "",
            duration: 40,
          },
          {
            start: "00:35",
            end: "01:25",
            inject: "NETW07T - Secure SNMP",
            description: "",
            duration: 50,
          },
        ].map((item) => {
          const parts = item.start.split(":").map(Number);
          const seconds = (parts[0] * 60 + parts[1]) * 60;
          return Object.assign({ startSeconds: seconds }, item);
        });

        const containerId = "inject-schedule";
        let startedAt = null;
        let timer = null;

        const formatCountdown = (totalSeconds) => {
          const clamped = Math.max(0, totalSeconds);
          const minutes = Math.floor(clamped / 60);
          const seconds = clamped % 60;
          return `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;
        };

        const getVisibleItems = (elapsedSeconds) => {
          return schedule.filter((item) => elapsedSeconds >= item.startSeconds);
        };

        const buildRow = (item, elapsedSeconds) => {
          const row = document.createElement("tr");
          row.className = "border-t dark:border-zinc-700";

          const cells = [
            item.start,
            item.end,
            item.inject,
            item.description,
            String(item.duration),
            formatCountdown(item.startSeconds + item.duration * 60 - elapsedSeconds),
          ];

          cells.forEach((value, index) => {
            const td = document.createElement("td");
            td.className = index === 2 ? "p-2 font-medium" : "p-2";
            td.textContent = value;
            row.appendChild(td);
          });

          return row;
        };

        const renderBody = (host, elapsedSeconds) => {
          const tbody = host.querySelector("tbody");
          if (!tbody) return;
          tbody.innerHTML = "";

          if (!startedAt) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");
            cell.className = "p-2 text-center";
            cell.colSpan = 6;
            cell.textContent = "Click Start Competition to begin.";
            row.appendChild(cell);
            tbody.appendChild(row);
            return;
          }

          const visibleItems = getVisibleItems(elapsedSeconds);
          if (visibleItems.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");
            cell.className = "p-2 text-center";
            cell.colSpan = 6;
            cell.textContent = "Waiting for the first inject...";
            row.appendChild(cell);
            tbody.appendChild(row);
            return;
          }

          visibleItems.forEach((item) => {
            tbody.appendChild(buildRow(item, elapsedSeconds));
          });
        };

        const ensureContainer = () => {
          let host = document.getElementById(containerId);
          if (!host) {
            host = document.createElement("div");
            host.id = containerId;
            host.className =
              "my-5 bg-slate-50 dark:bg-zinc-800 p-2 rounded-xl shadow-md dark:border border-zinc-700";

            const heading = document.createElement("h2");
            heading.className = "text-3xl font-bold text-center mb-2";
            heading.textContent = "Inject Schedule";
            host.appendChild(heading);

            const buttonRow = document.createElement("div");
            buttonRow.className = "flex justify-center mb-3";
            const button = document.createElement("button");
            button.className =
              "bg-slate-200 px-4 py-2 rounded shadow-sm hover:shadow-md active:shadow-sm text-slate-900 dark:bg-zinc-700 dark:text-slate-100";
            button.textContent = "Start Competition";
            button.addEventListener("click", async () => {
              if (startedAt) return;
              try {
                const res = await fetch("/api/competition/start", {
                  method: "POST",
                  credentials: "include",
                });
                if (res.ok) {
                  const data = await res.json();
                  if (data && data.started_at_ms) {
                    startedAt = data.started_at_ms;
                  }
                }
              } catch (e) {
                console.error("competition start failed", e);
              }
              if (!startedAt) return;
              button.disabled = true;
              const elapsed = Math.floor((Date.now() - startedAt) / 1000);
              renderBody(host, elapsed);
              timer = setInterval(() => {
                const tickElapsed = Math.floor((Date.now() - startedAt) / 1000);
                renderBody(host, tickElapsed);
              }, 1000);
            });
            buttonRow.appendChild(button);
            host.appendChild(buttonRow);

            const table = document.createElement("table");
            table.className = "table-auto w-full";
            table.innerHTML = `
              <thead>
                <tr class="text-left">
                  <th class="p-2">Start</th>
                  <th class="p-2">End</th>
                  <th class="p-2">Inject</th>
                  <th class="p-2">Short description (EN)</th>
                  <th class="p-2">Duration</th>
                  <th class="p-2">Time Remaining</th>
                </tr>
              </thead>
              <tbody></tbody>
            `;
            host.appendChild(table);
            renderBody(host, 0);
          }
          return host;
        };

        const insertContainer = () => {
          const host = ensureContainer();
          const container = document.getElementById("inject-schedule-only");
          if (!container) return false;
          if (!container.contains(host)) {
            container.appendChild(host);
          }
          return true;
        };

        const observer = new MutationObserver(() => insertContainer());
        window.addEventListener("DOMContentLoaded", async () => {
          try {
            const res = await fetch("/api/competition", { credentials: "include" });
            if (res.ok) {
              const data = await res.json();
              if (data && data.started_at_ms) {
                startedAt = data.started_at_ms;
              }
            }
          } catch (e) {
            console.error("competition status fetch failed", e);
          }
          insertContainer();
          const root = document.getElementById("root");
          if (root) observer.observe(root, { childList: true, subtree: true });
          if (startedAt) {
            const host = ensureContainer();
            const button = host.querySelector("button");
            if (button) button.disabled = true;
            const elapsed = Math.floor((Date.now() - startedAt) / 1000);
            renderBody(host, elapsed);
            timer = setInterval(() => {
              const tickElapsed = Math.floor((Date.now() - startedAt) / 1000);
              renderBody(host, tickElapsed);
            }, 1000);
          }
        });
      })();
    </script>
  </body>
</html>
