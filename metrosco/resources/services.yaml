HTTP: WEB/http_compare.sh $HTTP_URL expected/http_expected.txt
HTTPS: WEB/http_compare.sh $HTTPS_URL expected/https_expected.txt --insecure
SMTP: MAIL/smtp_check.py $SMTP_HOST $SMTP_PORT $SMTP_USER $SMTP_PASS $SMTP_FROM $SMTP_TO --starttls
POP3: MAIL/pop3_check.py $POP3_HOST $POP3_PORT $POP3_USER $POP3_PASS --ssl
FTP: FTP/login.sh $FTP_HOST $FTP_USER:$FTP_PASS $FTP_PATH
DNS: DNS/lookup.sh $DNS_RECORD $DNS_SERVER
Splunk: ./port.sh $SPLUNK_HOST $SPLUNK_PORT
